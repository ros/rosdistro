# Ubuntu package renames applied by:
#
#   scripts/autofix_rosdep.py --fix ubuntu-renames rosdep/base.yaml
#
# Each top level key is a rosdep key. Its value is a list of steps, applied in
# order. A step replaces packages in the entries of every current Ubuntu
# release from 'from' onward (and in the '*' entry, which newer releases use):
#
#   from:     first Ubuntu release (codename) the step applies to
#   replace:  old package name -> new package name, a list of names, or null
#             to drop the package
#
# All packages of a changed entry must exist in its release, otherwise the
# rule is not changed. Releases before 'from' keep resolving to the packages
# they do now, with entries added for them as needed.

# coinor-libcbc3 was renamed for the t64 transition.
coinor-libcbc3:
  - from: noble
    replace:
      coinor-libcbc3: coinor-libcbc3.1

# VTK 7 was replaced by VTK 9.
libvtk:
  - from: noble
    replace:
      libvtk7-dev: libvtk9-dev
libvtk-java:
  - from: noble
    replace:
      libvtk7-java: libvtk9-java
libvtk-qt:
  - from: noble
    replace:
      libvtk7-qt-dev: libvtk9-qt-dev

# New xmlrpc-c soname.
libxmlrpc-c++:
  - from: resolute
    replace:
      libxmlrpc-c++8-dev: libxmlrpc-c++9-dev

collada-dom:
  - from: resolute
    replace:
      libcollada-dom2.4-dp-dev: libcollada-dom-dev

# ntp and ntpdate are provided by ntpsec.
ntp:
  - from: resolute
    replace:
      ntp: ntpsec
ntpdate:
  - from: resolute
    replace:
      ntpdate: ntpsec-ntpdate

# Only the unhinted Roboto fonts remain.
fonts-roboto:
  - from: resolute
    replace:
      fonts-roboto-hinted: null

netpbm:
  - from: noble
    replace:
      libnetpbm10-dev: libnetpbm-dev
