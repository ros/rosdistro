# Debian package renames applied by:
#
#   scripts/autofix_rosdep.py --fix debian-renames rosdep/base.yaml
#
# Each top level key is a rosdep key. Its value is a list of steps, applied in
# order. A step replaces packages in the entries of every current (supported)
# Debian release from 'from' onward (and in the '*' entry, which newer
# releases use):
#
#   from:     first Debian release (codename) the step applies to
#   replace:  old package name -> new package name, a list of names, or null
#             to drop the package
#
# All packages of a changed entry must exist in its release, otherwise the
# rule is not changed. Releases before 'from' keep resolving to the packages
# they do now, with entries added for them as needed. A release with no entry,
# in a rule without '*', starts from the newest older release's entry.
#
# These are the keys of ubuntu_renames.yaml, checked against the bookworm and
# trixie package indices.

# coinor-libcbc3 was renamed for the t64 transition.
coinor-libcbc3:
  - from: trixie
    replace:
      coinor-libcbc3: coinor-libcbc3.1

# VTK 7 was replaced by VTK 9. The rules have entries only up to buster, so
# bookworm and trixie resolve to nothing now; they get entries from buster's.
libvtk:
  - from: bookworm
    replace:
      libvtk7-dev: libvtk9-dev
libvtk-java:
  - from: bookworm
    replace:
      libvtk7-java: libvtk9-java
libvtk-qt:
  - from: bookworm
    replace:
      libvtk7-qt-dev: libvtk9-qt-dev

# New xmlrpc-c soname.
libxmlrpc-c++:
  - from: trixie
    replace:
      libxmlrpc-c++8-dev: libxmlrpc-c++9-dev

# libcollada-dom2.4-dp-dev is an empty transitional package depending on
# libcollada-dom-dev (2.5) in bookworm and trixie, so this installs the same.
collada-dom:
  - from: bookworm
    replace:
      libcollada-dom2.4-dp-dev: libcollada-dom-dev

# ntp and ntpdate are provided by ntpsec; they are gone from trixie.
ntp:
  - from: trixie
    replace:
      ntp: ntpsec
ntpdate:
  - from: trixie
    replace:
      ntpdate: ntpsec-ntpdate

# Only the unhinted Roboto fonts remain in trixie.
fonts-roboto:
  - from: trixie
    replace:
      fonts-roboto-hinted: null

netpbm:
  - from: trixie
    replace:
      libnetpbm10-dev: libnetpbm-dev
